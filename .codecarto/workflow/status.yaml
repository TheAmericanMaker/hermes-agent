project_name: hermes-agent
pipeline: workflow/pipeline-full-with-deep-audit.yaml
current_phase: defect-scan-semantic
last_updated: "2026-05-06"

phases:
  architecture:
    status: complete
    owner_notes:
      - "Sync-loop-inside-async-gateway is the central portability hazard. AIAgent.run_conversation() is a blocking while-loop with sequential tool dispatch but lives inside an asyncio gateway running 18+ platform listeners."
      - "Three config loaders + one runtime hub + two message guards is a coupling cluster routed to defect-scan-mechanical and defect-scan-semantic."
      - "Surface area is wide but priority is clear. ~6 core components, ~10 important. 18+ messaging platforms and 6 terminal backends are bulk LOC but each independently portable; agent loop and tool registry are the irreducible kernel."
    outputs_present:
      - findings/architecture/architecture-map.md
      - findings/public-surfaces/public-surfaces.md
      - findings/runtime-lifecycle/runtime-lifecycle.md
      - findings/state-and-storage/state-and-storage.md
      - findings/build-and-deploy/build-and-deploy.md
      - findings/config-model/config-model.md
    open_questions:
      - {id: arch-OQ1, kind: open-question, description: "Shutdown ordering across asyncio gateway listeners and the blocking AIAgent.run_conversation() loop is unclear."}
      - {id: arch-OQ2, kind: open-question, description: "acp_registry/ runtime behavior: how the registry is populated and queried; in-memory vs persisted."}
      - {id: arch-OQ3, kind: open-question, description: "cli.py (root) vs hermes_cli/ overlap: which is the live entrypoint and what does cli.py preserve for backward compat?"}
      - {id: arch-OQ4, kind: open-question, description: "gateway/session.py concurrency primitive: asyncio.Lock vs threading.Lock vs unguarded shared state."}
      - {id: arch-OQ5, kind: open-question, description: "web/ api_server agent-reuse pattern: fresh AIAgent per request vs process-wide vs pool."}
    carry_forward:
      - {id: arch-CF1, kind: defer-to-phase, target_phase: contracts, description: "Full slash-command catalog (RESOLVED in contracts phase: 58 commands cataloged in public-surfaces)."}
      - {id: arch-CF2, kind: defer-to-phase, target_phase: protocols, description: "RPC schemas - MCP, ACP, gateway envelopes (RESOLVED in protocols phase)."}
      - {id: arch-CF3, kind: defer-to-phase, target_phase: protocols, description: "Persistent schemas - session files, sqlite/asyncpg, JSONL trajectory, prompt-cache (RESOLVED in protocols phase)."}
      - {id: arch-CF4, kind: defer-to-phase, target_phase: protocols, description: "Gateway state machine - listener lifecycle, session resume, retry/backoff, dedup (RESOLVED in protocols phase)."}
      - {id: arch-CF5, kind: defer-to-phase, target_phase: defect-scan-mechanical, description: "_last_resolved_tool_names global (RESOLVED in defect-scan-mechanical: D1.1)."}
      - {id: arch-CF6, kind: defer-to-phase, target_phase: defect-scan-mechanical, description: "Plugin-discovery side-effect on import (RESOLVED in defect-scan-mechanical: D1.2/D2.7/D6.8)."}
      - {id: arch-CF7, kind: defer-to-phase, target_phase: defect-scan-mechanical, description: "ANSI escape leak in terminal backends (RESOLVED in defect-scan-mechanical: D6.6 + open question for display.py read)."}
      - {id: arch-CF8, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "Two-guard concurrency: _pending_messages + command-interceptor invariant."}
      - {id: arch-CF9, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "Prompt-cache invariant: cache key stability across tool-call insertions and compaction."}
      - {id: arch-CF10, kind: defer-to-phase, target_phase: porting, description: "167KB auxiliary_client.py concept-level decomposition."}
      - {id: arch-CF11, kind: defer-to-phase, target_phase: reimplementation-spec, description: "Platform MVP cut: which subset of 18+ messaging platforms is in 'minimum viable port' tier."}

  defect-scan-mechanical:
    status: complete
    owner_notes:
      - "Two highest-impact mechanical defects both in gateway/config.py: D6.1 (yaml->os.environ mutation breaks env-var precedence) and D2.1 (single broad except swallows all per-platform mappings). Both fix-before-porting."
      - "Three architecture carry-forwards (arch-CF5/CF6/CF7) routed into Phase 2 were resolved with concrete findings (D1.1, D1.2/D2.7/D6.8, D6.6)."
      - "The 'three config loaders + one runtime hub + two message guards' coupling cluster from architecture is now concretely sourced: hermes_cli.config.load_config, hermes_cli.config.read_raw_config, gateway.config.load_gateway_config plus inline yaml.safe_load. D6.2 captures the consistency hazard."
    outputs_present:
      - findings/defect-scan-mechanical/mechanical-defects.md
    open_questions:
      - {id: dsm-OQ1, kind: open-question, description: "arch-CF7 ANSI escape leak: cli.py display.py not directly read under budget; routed forward to protocols phase log-format work."}
    carry_forward:
      - {id: dsm-CF1, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "_last_resolved_tool_names TOCTOU race between subagent threads and parent (concurrency, pass 3)."}
      - {id: dsm-CF2, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "agent/retry_utils.py jitter seed correlation under coarse clocks (concurrency, pass 3)."}
      - {id: dsm-CF3, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "gateway os.environ writes leak provider tokens to subprocesses; _HERMES_PROVIDER_ENV_BLOCKLIST does not cover *_PROXY / *_FREE_RESPONSE_CHANNELS (security, pass 4)."}
      - {id: dsm-CF4, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "error_classifier retries on unknown=retryable=True indefinitely (contract, pass 5)."}
      - {id: dsm-CF5, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "post_tool_call/transform_tool_result hooks not fired on dispatch failure (contract, pass 5)."}
      - {id: dsm-CF6, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "transform_tool_result 'first string wins' depends on filesystem iteration order (contract, pass 5)."}

  contracts:
    status: complete
    owner_notes:
      - "Two-message-guards pattern (_pending_messages queue + gateway/run.py command interceptor) is the single highest-risk concurrency contract; any new always-reach command that misses either guard silently queues behind a running agent. Routed to defect-scan-semantic (ctr-CF5)."
      - "Authorization has a one-flag trapdoor: GATEWAY_ALLOW_ALL_USERS and TEAMS_ALLOW_ALL_USERS flip default-deny to default-allow with a single env var. Per-adapter allowlist consultation needs verification (ctr-CF7)."
      - "58 slash commands cataloged from hermes_cli/commands.py COMMAND_REGISTRY; arch-CF1 resolved."
    outputs_present:
      - findings/contracts/behavioral-contracts.md
