      - {id: ctr-CF5, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "Audit two-guard pattern: every always-reach command must bypass both _pending_messages and gateway/run.py interceptor."}
      - {id: ctr-CF6, kind: defer-to-phase, target_phase: defect-scan-semantic, description: "Verify allow-always approval persistence on the CLI side."}
