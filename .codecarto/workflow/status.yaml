      - {id: ctr-CF11, kind: defer-to-phase, target_phase: reimplementation-spec, description: "Default-deny vs default-allow auth model: spec must declare which posture the port adopts."}

  protocols:
    status: complete
    owner_notes:
      - "Six state machines documented (gateway listener, SessionEntry lifecycle, agent turn, stream consumer, tool call, MCP EventBridge). The two-guard pattern shows up in three of them; the prompt-cache invariant constrains agent-turn and stream-consumer transitions."
      - "SQLite SessionDB schema_version=11 fully documented (sessions + messages + state_meta + FTS5). JSONL transcripts coexist as legacy fallback with a length-preferred read path that prevents silent truncation post-migration."
      - "18-row compatibility hazards table is the densest portability output of the run so far. Highest-severity: ANSI terminal semantics, Unicode width, async-vs-sync ordering, shell quoting, process-global state mutation, implicit import-side-effect ordering, two-guard message dispatch."
